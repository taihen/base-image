name: Build & Test

# Reusable build and test pipeline. It publishes images under ephemeral
# run-scoped tags and never signs, promotes or releases anything, so it needs
# no id-token or attestations permission. That keeps PR validation callers on a
# minimal token. Signing, tag promotion and releases live in publish.yml.
#
# Callers:
#   pr-validation.yml  on pull_request
#   publish.yml        on push to main and on schedule

on:
  workflow_call:
    inputs:
      ref:
        description: 'The git ref to checkout for validation'
        required: true
        type: string
      history_workflow:
        description: >-
          Workflow file whose last successful run supplies the previous digests
          and SBOM used for change detection. This must name a workflow that
          actually produces runs of its own. A reusable workflow does not, as
          its jobs are recorded under the caller's run.
        required: false
        type: string
        default: publish.yml
    outputs:
      base-digest:
        description: 'Canonical repo@sha256 ref for the base image'
        value: ${{ jobs.build.outputs.base-digest }}
      glibc-digest:
        description: 'Canonical repo@sha256 ref for the glibc image'
        value: ${{ jobs.build.outputs.glibc-digest }}
      debug-digest:
        description: 'Canonical repo@sha256 ref for the debug image'
        value: ${{ jobs.build.outputs.debug-digest }}
      has-changes:
        description: 'Whether package contents moved since the last publish'
        value: ${{ jobs.build.outputs.has-changes }}

jobs:
  # Publishes images under ephemeral run-scoped tags only. Floating tags
  # (latest/glibc/debug), signatures and attestations are applied by the
  # promote job in publish.yml after the test job has passed, so an unscanned
  # image is never reachable through a consumable tag.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base-digest: ${{ steps.extract-digest.outputs.base-digest }}
      glibc-digest: ${{ steps.extract-digest.outputs.glibc-digest }}
      debug-digest: ${{ steps.extract-digest.outputs.debug-digest }}
      has-changes: ${{ steps.compare.outputs.has-changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Get previous SBOM from last successful run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HISTORY_WORKFLOW: ${{ inputs.history_workflow }}
        run: |
          # Best-effort freshness baseline. Every lookup here is allowed to
          # fail: with no baseline the SBOM comparison reports "changed",
          # the same conservative path the very first build takes.
          #
          # This step must never fail the job. Artifact metadata outlives the
          # artifact itself, so a download returns HTTP 410 Gone long after
          # the ID lookup succeeds. Treating that as fatal deadlocked the
          # pipeline: the build died here before apko ever ran, so no run
          # could succeed, so the "last successful run" pointer never
          # advanced past the run whose artifacts had already expired.
          echo "Fetching the previous SBOM from the last successful workflow run..."

          api() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          # Downloads artifact "$1" to "$2". Returns non-zero when it is
          # absent, already expired, or the download itself fails.
          fetch_artifact() {
            local artifact_name="$1"
            local out="$2"
            local artifact_id
            artifact_id=$(printf '%s' "$ARTIFACTS" | jq -r --arg n "$artifact_name" \
              'first(.artifacts[] | select(.name == $n and .expired == false) | .id) // empty')
            if [ -z "$artifact_id" ]; then
              echo "No usable $artifact_name artifact (absent or expired)"
              return 1
            fi
            echo "Found $artifact_name artifact: $artifact_id"
            if ! api "/repos/$REPO/actions/artifacts/$artifact_id/zip" \
              > "$out" 2> "$RUNNER_TEMP/artifact-error"; then
              echo "WARNING: could not download $artifact_name artifact:" \
                "$(cat "$RUNNER_TEMP/artifact-error")"
              rm -f "$out"
              return 1
            fi
          }

          ARTIFACTS='{"artifacts":[]}'
          LAST_RUN=$(api \
            "/repos/$REPO/actions/workflows/$HISTORY_WORKFLOW/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
          if [ -n "$LAST_RUN" ]; then
            echo "Found last successful run: $LAST_RUN"
            ARTIFACTS=$(api "/repos/$REPO/actions/runs/$LAST_RUN/artifacts" 2>/dev/null \
              || echo '{"artifacts":[]}')
          else
            echo "No previous successful workflow run found"
          fi

          if fetch_artifact previous-sbom sbom-artifact.zip; then
            mkdir -p previous-sbom
            if unzip -q -o sbom-artifact.zip -d previous-sbom/; then
              echo "Previous SBOM downloaded successfully"
            else
              echo "WARNING: previous SBOM archive could not be extracted"
              rm -rf previous-sbom
            fi
            rm -f sbom-artifact.zip
          fi
      - name: Install apko
        env:
          APKO_VERSION: 1.2.25
          APKO_SHA256: b5a480cfb32458f55d1f1513a902f6cdf7dc284b9e6fe9840abdbcebc3908d47
        run: |
          set -e
          tmp=$(mktemp -d)
          apko_archive="apko_${APKO_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/${apko_archive}" \
            -o "$tmp/${apko_archive}"
          echo "${APKO_SHA256}  $tmp/${apko_archive}" | sha256sum -c -
          tar -xzf "$tmp/${apko_archive}" -C "$tmp"
          sudo install -m 0755 "$tmp/apko_${APKO_VERSION}_linux_amd64/apko" /usr/local/bin/apko
          rm -rf "$tmp"
          apko version
      - name: Build and publish images (ephemeral tags, unsigned)
        id: build
        env:
          OCI_HOST: ghcr.io
          OCI_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Reproducible image timestamps tied to the commit, not epoch 0
          # (epoch 0 trips freshness checks) and not wall clock (breaks
          # byte-reproducibility).
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"

          echo "$GITHUB_TOKEN" | apko login "$OCI_HOST" -u "${{ github.actor }}" --password-stdin

          mkdir -p sbom-base sbom-glibc sbom-debug

          # Run-scoped tags keep unscanned images out of every consumable
          # tag; the promote job moves latest/glibc/debug after tests pass.
          EPHEMERAL_PREFIX="$OCI_HOST/$OCI_REPO:build-${{ github.run_id }}"
          REVISION_ANNOTATION="org.opencontainers.image.revision:${{ github.sha }}"

          echo "Building base image..."
          base_digest=$(apko publish base.yaml "$EPHEMERAL_PREFIX-base" \
            --lockfile base.lock.json \
            --annotations "$REVISION_ANNOTATION" \
            --sbom-path=sbom-base)

          echo "Building glibc image..."
          glibc_digest=$(apko publish glibc.yaml "$EPHEMERAL_PREFIX-glibc" \
            --lockfile glibc.lock.json \
            --annotations "$REVISION_ANNOTATION" \
            --sbom-path=sbom-glibc)

          echo "Building debug image..."
          debug_digest=$(apko publish debug.yaml "$EPHEMERAL_PREFIX-debug" \
            --lockfile debug.lock.json \
            --annotations "$REVISION_ANNOTATION" \
            --sbom-path=sbom-debug)

          mkdir -p sbom-output
          for f in sbom-base/*.json; do
            if [ -f "$f" ]; then
              cp "$f" "sbom-output/base_$(basename "$f")"
            fi
          done
          for f in sbom-glibc/*.json; do
            if [ -f "$f" ]; then
              cp "$f" "sbom-output/glibc_$(basename "$f")"
            fi
          done
          for f in sbom-debug/*.json; do
            if [ -f "$f" ]; then
              cp "$f" "sbom-output/debug_$(basename "$f")"
            fi
          done

          # Normalize to canonical repo@sha256 refs so the ephemeral tag
          # never leaks into signatures, attestations, or release notes.
          echo "$OCI_HOST/$OCI_REPO@${base_digest##*@}" > base-digest.txt
          echo "$OCI_HOST/$OCI_REPO@${glibc_digest##*@}" > glibc-digest.txt
          echo "$OCI_HOST/$OCI_REPO@${debug_digest##*@}" > debug-digest.txt
      - name: Extract digests
        id: extract-digest
        run: |
          # Read the digests from the files created in the container
          BASE_DIGEST=$(cat base-digest.txt)
          GLIBC_DIGEST=$(cat glibc-digest.txt)
          DEBUG_DIGEST=$(cat debug-digest.txt)
          echo "base-digest=$BASE_DIGEST" >> $GITHUB_OUTPUT
          echo "glibc-digest=$GLIBC_DIGEST" >> $GITHUB_OUTPUT
          echo "debug-digest=$DEBUG_DIGEST" >> $GITHUB_OUTPUT
          echo "Extracted base digest: $BASE_DIGEST"
          echo "Extracted glibc digest: $GLIBC_DIGEST"
          echo "Extracted debug digest: $DEBUG_DIGEST"
      - name: Compare SBOMs
        id: sbom-compare
        run: python3 scripts/compare_sboms.py
      - name: Determine whether packages changed
        id: compare
        run: |
          SBOM_CHANGES="${{ steps.sbom-compare.outputs.sbom-changes }}"
          echo "SBOM changes: $SBOM_CHANGES"
          if [ "$SBOM_CHANGES" = true ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in packages"
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in packages"
          fi
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom-output/
      - name: Upload SBOM for future comparisons
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previous-sbom
          path: sbom-output/
          retention-days: 30
          overwrite: true
  test:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        variant: [base, glibc, debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: linux/arm64,linux/amd64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Set test configuration
        id: test-config
        run: |
          if [ "${{ matrix.variant }}" = "base" ]; then
            echo "base-image=${{ needs.build.outputs.base-digest }}" >> $GITHUB_OUTPUT
            echo "expected-user=65532" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.variant }}" = "glibc" ]; then
            echo "base-image=${{ needs.build.outputs.glibc-digest }}" >> $GITHUB_OUTPUT
            echo "expected-user=65532" >> $GITHUB_OUTPUT
          else
            echo "base-image=${{ needs.build.outputs.debug-digest }}" >> $GITHUB_OUTPUT
            echo "expected-user=0" >> $GITHUB_OUTPUT
          fi
      - name: Create test Go application for ${{ matrix.variant }}
        run: |
          mkdir -p test-app
          cat > test-app/main.go << 'EOF'
          package main
          import (
              "fmt"
              "os"
              "runtime"
          )
          func main() {
              fmt.Printf("Hello from base-image test (${{ matrix.variant }})!\n")
              fmt.Printf("OS: %s\n", runtime.GOOS)
              fmt.Printf("Arch: %s\n", runtime.GOARCH)
              fmt.Printf("Go version: %s\n", runtime.Version())
              fmt.Printf("User: %d\n", os.Getuid())
              fmt.Printf("Group: %d\n", os.Getgid())
              // Test that we can read environment variables
              if testVar := os.Getenv("TEST_VAR"); testVar != "" {
                  fmt.Printf("TEST_VAR: %s\n", testVar)
              }
              // Test that we're running as expected user
              expectedUser := ${{ steps.test-config.outputs.expected-user }}
              if os.Getuid() != expectedUser {
                  fmt.Printf("ERROR: Expected UID %d, got %d\n", expectedUser, os.Getuid())
                  os.Exit(1)
              }
              fmt.Println("All tests passed!")
          }
          EOF
      - name: Create test Dockerfile for ${{ matrix.variant }}
        run: |
          cat > test-app/Dockerfile << 'EOF'
          # Declare build args at the top for global scope
          ARG BASE_IMAGE

          # Build stage
          FROM golang:1.23-alpine AS builder
          WORKDIR /build
          COPY main.go .
          # Build for both architectures
          ARG TARGETARCH
          RUN CGO_ENABLED=1 go build -ldflags="-s -w" -o hello main.go

          # Runtime stage using our base image
          FROM $BASE_IMAGE
          COPY --from=builder /build/hello /hello
          # Keep the user as-is from the base image (nonroot for main, root for debug)
          ENTRYPOINT ["/hello"]
          EOF
      - name: Test ${{ matrix.variant }} image on linux/amd64
        run: |
          echo "Testing ${{ matrix.variant }} on linux/amd64..."
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=${{ steps.test-config.outputs.base-image }} \
            --load \
            -t test-app:amd64 \
            test-app/

          # Run the test
          docker run --rm \
            --platform linux/amd64 \
            -e TEST_VAR="Hello from ${{ matrix.variant }} test" \
            test-app:amd64
      - name: Test ${{ matrix.variant }} image on linux/arm64
        run: |
          echo "Testing ${{ matrix.variant }} on linux/arm64..."
          docker buildx build \
            --platform linux/arm64 \
            --build-arg BASE_IMAGE=${{ steps.test-config.outputs.base-image }} \
            --load \
            -t test-app:arm64 \
            test-app/

          # Run the test (will use qemu if not on arm64 host)
          docker run --rm \
            --platform linux/arm64 \
            -e TEST_VAR="Hello from ${{ matrix.variant }} test" \
            test-app:arm64
      - name: Security scan with Trivy for ${{ matrix.variant }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.test-config.outputs.base-image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
