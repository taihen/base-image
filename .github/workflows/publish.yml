name: Build, Test & Publish

# Release pipeline for main. It calls the reusable build.yml for the build and
# test stages, then signs, attests, promotes the floating tags and cuts a
# release. Everything that needs id-token or attestations lives here rather
# than in build.yml, so PR validation never receives those permissions.
#
# Images are signed by this workflow, so the cosign certificate identity is
# .github/workflows/publish.yml, not build.yml.

on:
  # Trigger on pushes to the main branch (for releases)
  push:
    branches: [ main ]
  # Trigger on a schedule (for daily updates)
  schedule:
    - cron: '0 5 * * *'

permissions: {}

jobs:
  validate:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.sha }}
      history_workflow: publish.yml
    secrets: inherit

  # Runs only after build.yml's tests (including the Trivy scan) pass: signs
  # images, attaches SBOM and SLSA provenance attestations, then moves the
  # floating tags.
  promote:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.21.5
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom-output
      - name: Sign images and attest SBOMs
        env:
          BASE_DIGEST: ${{ needs.validate.outputs.base-digest }}
          GLIBC_DIGEST: ${{ needs.validate.outputs.glibc-digest }}
          DEBUG_DIGEST: ${{ needs.validate.outputs.debug-digest }}
        run: |
          set -e
          # Fulcio and Rekor are public services and occasionally reset the
          # connection mid-handshake. Both operations are idempotent enough to
          # retry: a duplicate signature or attestation is harmless.
          retry() {
            attempt=1
            max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "ERROR: '$*' failed after $max attempts"
                return 1
              fi
              delay=$((attempt * 10))
              echo "Attempt $attempt failed, retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }
          for variant in base glibc debug; do
            case "$variant" in
              base) digest="$BASE_DIGEST" ;;
              glibc) digest="$GLIBC_DIGEST" ;;
              debug) digest="$DEBUG_DIGEST" ;;
            esac
            sbom="sbom-output/${variant}_sbom-index.spdx.json"
            if [ ! -s "$sbom" ]; then
              echo "ERROR: missing or empty SBOM predicate: $sbom"
              exit 1
            fi
            echo "Signing $variant image..."
            retry cosign sign --yes "$digest"
            echo "Attesting SBOM for $variant image..."
            retry cosign attest --yes --type spdxjson --predicate "$sbom" "$digest"
          done
      - name: Extract bare digests
        id: digests
        env:
          BASE_DIGEST: ${{ needs.validate.outputs.base-digest }}
          GLIBC_DIGEST: ${{ needs.validate.outputs.glibc-digest }}
          DEBUG_DIGEST: ${{ needs.validate.outputs.debug-digest }}
        run: |
          echo "base-sha=${BASE_DIGEST##*@}" >> $GITHUB_OUTPUT
          echo "glibc-sha=${GLIBC_DIGEST##*@}" >> $GITHUB_OUTPUT
          echo "debug-sha=${DEBUG_DIGEST##*@}" >> $GITHUB_OUTPUT
      - name: Attest build provenance (base)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.base-sha }}
          push-to-registry: true
      - name: Attest build provenance (glibc)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.glibc-sha }}
          push-to-registry: true
      - name: Attest build provenance (debug)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.debug-sha }}
          push-to-registry: true
      - name: Promote floating tags
        env:
          BASE_DIGEST: ${{ needs.validate.outputs.base-digest }}
          GLIBC_DIGEST: ${{ needs.validate.outputs.glibc-digest }}
          DEBUG_DIGEST: ${{ needs.validate.outputs.debug-digest }}
        run: |
          set -e
          crane tag "$BASE_DIGEST" "latest"
          crane tag "$GLIBC_DIGEST" "glibc"
          crane tag "$DEBUG_DIGEST" "debug"
          echo "Promoted floating tags: latest, glibc, debug"
  release:
    if: needs.validate.outputs.has-changes == 'true'
    needs: [validate, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate release tag
        id: tag
        run: |
          # Generate a date-based tag for the release
          TAG="v$(date +'%Y.%m.%d')"
          COUNTER=0

          # Check if tag already exists and increment counter if needed
          while git ls-remote --tags origin | grep -q "refs/tags/${TAG}"; do
            COUNTER=$((COUNTER + 1))
            TAG="v$(date +'%Y.%m.%d').${COUNTER}"
          done
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom-output
      - name: List downloaded SBOMs for debugging
        run: |
          echo "Contents of sbom-output:"
          ls -R sbom-output
      - name: Compare SBOMs and Generate Changelog
        id: sbom-diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install requests
          python3 scripts/generate_changelog.py
      - name: Upload SBOM changelog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-changelog
          path: |
            sbom-changelog.md
            sbom-changes.json
          retention-days: 90
      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.21.5
      - name: Tag images with release version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BASE_DIGEST: ${{ needs.validate.outputs.base-digest }}
          GLIBC_DIGEST: ${{ needs.validate.outputs.glibc-digest }}
          DEBUG_DIGEST: ${{ needs.validate.outputs.debug-digest }}
        run: |
          set -e

          crane tag "$BASE_DIGEST" "$TAG"
          crane tag "$GLIBC_DIGEST" "$TAG-glibc"
          crane tag "$DEBUG_DIGEST" "$TAG-debug"

          echo "Successfully tagged images:"
          echo "Base: $TAG"
          echo "glibc: $TAG-glibc"
          echo "Debug: $TAG-debug"
      - name: Create release body
        run: |
          # Read the SBOM changelog
          SBOM_CHANGELOG=$(<sbom-changelog.md)

          # Set variables from GitHub Actions context
          REPO="${{ github.repository }}"
          TAG="${{ steps.tag.outputs.tag }}"
          BASE_DIGEST="${{ needs.validate.outputs.base-digest }}"
          GLIBC_DIGEST="${{ needs.validate.outputs.glibc-digest }}"
          DEBUG_DIGEST="${{ needs.validate.outputs.debug-digest }}"
          cat > release-body.md << RELEASE_EOF
          ## 🚀 Automated Release
          This release includes all three image variants: base (static, no libc), glibc, and debug.
          $SBOM_CHANGELOG

          ### 📦 Container Images
          **Base Image (Production - static, no libc)**
          - **Image**: \`ghcr.io/${REPO}:latest\`
          - **Tagged Version**: \`ghcr.io/${REPO}:${TAG}\`
          - **Digest**: \`${BASE_DIGEST}\`

          **glibc Image (Production - GNU libc)**
          - **Image**: \`ghcr.io/${REPO}:glibc\`
          - **Tagged Version**: \`ghcr.io/${REPO}:${TAG}-glibc\`
          - **Digest**: \`${GLIBC_DIGEST}\`

          **Debug Image (Development)**
          - **Image**: \`ghcr.io/${REPO}:debug\`
          - **Tagged Version**: \`ghcr.io/${REPO}:${TAG}-debug\`
          - **Digest**: \`${DEBUG_DIGEST}\`

          ### 🔐 Verification
          You can verify all image signatures using:
          \`\`\`bash
          # Base image
          cosign verify ${BASE_DIGEST} \\
            --certificate-identity=https://github.com/${REPO}/.github/workflows/publish.yml@refs/heads/main \\
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com

          # glibc image
          cosign verify ${GLIBC_DIGEST} \\
            --certificate-identity=https://github.com/${REPO}/.github/workflows/publish.yml@refs/heads/main \\
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com

          # Debug image
          cosign verify ${DEBUG_DIGEST} \\
            --certificate-identity=https://github.com/${REPO}/.github/workflows/publish.yml@refs/heads/main \\
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          \`\`\`

          Each image also carries a signed SPDX SBOM attestation and SLSA
          build provenance:
          \`\`\`bash
          # SBOM attestation
          cosign verify-attestation ${BASE_DIGEST} --type spdxjson \\
            --certificate-identity=https://github.com/${REPO}/.github/workflows/publish.yml@refs/heads/main \\
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com

          # SLSA build provenance
          gh attestation verify oci://${BASE_DIGEST} --repo ${REPO}
          \`\`\`

          ### 📄 Software Bill of Materials (SBOM)
          SBOMs for all three images are attached to this release.

          ### ⚠️ Debug Image Warning
          The debug image should **NEVER** be used in production as it includes debugging tools and runs as root.
          RELEASE_EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: release-body.md
          files: |
            sbom-output/base_*.json
            sbom-output/glibc_*.json
            sbom-output/debug_*.json
            sbom-changelog.md
            sbom-changes.json
          generate_release_notes: false
          draft: false
          prerelease: false
