name: Update Lockfiles

# Keeps the apko lockfiles fresh ahead of the 05:00 publish run.
#
# The previous shape opened a fresh dated branch + PR on every run and left them
# there: 63 stale branches and 18 open PRs, none of which could ever go green.
# Two structural reasons:
#
#   1. A PR opened with GITHUB_TOKEN does not trigger the pull_request workflow,
#      so `PR Validation` never runs on it and its checks stay empty forever.
#   2. Nothing merged them, so each day simply added another one.
#
# This version keeps exactly one PR alive and gates it on a real build:
#
#   refresh   regenerates the lockfiles on a fixed branch, force-pushing it so a
#             newer regeneration supersedes the old diff instead of stacking
#   validate  calls build.yml directly (workflow_call is not subject to the
#             GITHUB_TOKEN trigger suppression), so the PR carries real evidence
#   merge     squash-merges only when that build passed
#
# The merge lands on main around 04:15; the scheduled publish at 05:00 picks up
# the new lockfiles. If validation fails, the PR stays open and red, and the
# next run force-pushes over it — still exactly one open PR.
#
# Set the repository variable LOCK_AUTOMERGE=false to keep the PR but leave the
# merge to a human.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: update-locks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      branch: ${{ steps.vars.outputs.branch }}
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apko
        env:
          APKO_VERSION: 1.2.25
          APKO_SHA256: b5a480cfb32458f55d1f1513a902f6cdf7dc284b9e6fe9840abdbcebc3908d47
        run: |
          set -e
          tmp=$(mktemp -d)
          apko_archive="apko_${APKO_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/${apko_archive}" \
            -o "$tmp/${apko_archive}"
          echo "${APKO_SHA256}  $tmp/${apko_archive}" | sha256sum -c -
          tar -xzf "$tmp/${apko_archive}" -C "$tmp"
          sudo install -m 0755 "$tmp/apko_${APKO_VERSION}_linux_amd64/apko" /usr/local/bin/apko
          rm -rf "$tmp"
          apko version

      - name: Regenerate lockfiles
        run: |
          set -e
          for cfg in base glibc debug; do
            apko lock "$cfg.yaml" --output "$cfg.lock.json"
          done

      - name: Resolve branch name
        id: vars
        run: echo "branch=chore/lock-refresh" >> "$GITHUB_OUTPUT"

      - name: Commit and open or update the PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          set -e
          if git diff --quiet -- '*.lock.json'; then
            echo "Lockfiles unchanged, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- '*.lock.json'
          git commit -m "chore(deps): refresh apko lockfiles $(date +%Y-%m-%d)"

          # Force: the branch is a rolling slot, so today's regeneration replaces
          # whatever an earlier run left unmerged.
          git push --force origin "$BRANCH"

          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Rolling PR already open, updated in place."
            exit 0
          fi

          gh pr create \
            --head "$BRANCH" \
            --title "chore(deps): refresh apko lockfiles" \
            --body "Automated Wolfi package refresh via \`apko lock\`. The diff shows the exact package version changes.

          The \`validate\` job of the Update Lockfiles workflow builds this branch, so the checks on this PR are evidence for the bump. The branch is force-pushed by each run, so this PR always carries the latest regeneration."

          # Cosmetic, and it used to fail the step after the branch was pushed,
          # leaving an orphan branch and no PR.
          gh pr edit "$BRANCH" --add-label dependencies \
            || echo "WARNING: could not add 'dependencies' label; PR was still created."

  validate:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.refresh.outputs.ref }}
    secrets: inherit

  merge:
    needs: [refresh, validate]
    if: needs.refresh.outputs.changed == 'true' && vars.LOCK_AUTOMERGE != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge the validated lockfile refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.refresh.outputs.branch }}
        run: |
          set -e
          gh pr merge "$BRANCH" --squash --delete-branch
